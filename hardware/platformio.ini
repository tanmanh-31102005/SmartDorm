[env:esp32dev]
platform = espressif32@6.3.2
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200

lib_deps =
  knolleary/PubSubClient @ ^2.8.0
  adafruit/DHT sensor library @ ^1.4.4
  adafruit/Adafruit Unified Sensor @ ^1.1.9
  bblanchon/ArduinoJson @ ^6.21.3

build_flags =
  -DCORE_DEBUG_LEVEL=0
