services:
  # ==========================================
  # 0. LOCAL MQTT BROKER (Mosquitto 2.0)
  # ==========================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smartdorm-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  # ==========================================
  # 1. TIME-SERIES DATABASE (InfluxDB 2.7)
  # ==========================================
  influxdb:
    image: influxdb:2.7
    container_name: smartdorm-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=smart-dormitory
      - DOCKER_INFLUXDB_INIT_BUCKET=smart-dormitory-raw
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=smart-dormitory-super-secret-token-12345
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. AI / ML MICROSERVICE (FastAPI Python)
  # ==========================================
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: smartdorm-ml-service
    ports:
      - "8000:8000"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=smart-dormitory-super-secret-token-12345
      - INFLUXDB_ORG=smart-dormitory
      - INFLUXDB_BUCKET=smart-dormitory-raw
      - DATABASE_URL=sqlite:///app/prisma/dev.db
    volumes:
      - ./backend/prisma:/app/prisma
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # 3. BACKEND API & WEBSOCKET (NestJS)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartdorm-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/prisma/dev.db
      - JWT_SECRET=smart_dormitory_jwt_secret_key_2026_super_secure
      - JWT_EXPIRES_IN=7d
      - MQTT_BROKER_URL=mqtt://broker.hivemq.com:1883
      - ML_SERVICE_URL=http://ml-service:8000
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=smart-dormitory-super-secret-token-12345
      - INFLUXDB_ORG=smart-dormitory
      - INFLUXDB_BUCKET=smart-dormitory-raw
    volumes:
      - ./backend/prisma:/app/prisma
    depends_on:
      - influxdb
      - ml-service
    restart: unless-stopped

  # ==========================================
  # 4. FRONTEND USER INTERFACE (Next.js)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartdorm-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
      - NEXT_PUBLIC_WS_URL=http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  influxdb-data:
    name: smartdorm_influxdb_data
  influxdb-config:
    name: smartdorm_influxdb_config
