# ============================================================
# SmartDorm — Mosquitto MQTT Broker Configuration
# ============================================================
#
# CHẾ ĐỘ DEVELOPMENT (mặc định):
#   allow_anonymous true  — Dễ test với Wokwi, MQTT Explorer
#
# CHẾ ĐỘ PRODUCTION (khuyến nghị khi deploy thật):
#   1. Tạo password file: mosquitto_passwd -c mosquitto_passwd smartdorm_backend
#   2. Đổi allow_anonymous thành false
#   3. Bật dòng password_file
#   4. Cập nhật ESP32 firmware với MQTT_USER/MQTT_PASS
# ============================================================

# ---- MQTT TCP Listener (Port 1883) ----
listener 1883

# DEVELOPMENT: Cho phép kết nối không xác thực (tiện test với Wokwi/MQTT Explorer)
# PRODUCTION: Đổi thành false và bật password_file bên dưới
allow_anonymous true

# PRODUCTION: Bỏ comment 2 dòng này và đổi allow_anonymous thành false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# ---- WebSocket Listener (Port 9001 — cho Frontend/Dashboard) ----
listener 9001
protocol websockets
allow_anonymous true

# ---- Logging ----
log_type error
log_type warning
log_type notice
